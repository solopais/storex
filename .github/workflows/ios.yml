name: Build StoreX App

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.24.5"
  # iOS Bundle ID（对应 flutter create --org cn.solopai --project-name storex_app）
  BUNDLE_ID: "cn.solopai.storexApp"

jobs:
  # ---------- iOS IPA ----------
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"
          cache: true

      - name: Prepare native scaffolding
        # 我们手写的 Dart 源码在 lib/ 里，但 ios/android/web 原生脚手架需 flutter 生成。
        # 先备份 lib/ -> flutter create 生成原生工程 -> 用备份覆盖回去（避免被默认计数器 demo 覆盖）。
        run: |
          cp -r lib /tmp/storex_lib
          flutter create --org cn.solopai --project-name storex_app .
          rm -rf lib
          cp -r /tmp/storex_lib lib
          rm -f test/widget_test.dart

      - name: Install dependencies
        run: flutter pub get

      - name: Build (no codesign — 仅验证可编译)
        if: ${{ secrets.P12_BASE64 == '' }}
        run: flutter build ipa --no-codesign --release

      - name: Build (signed AdHoc)
        if: ${{ secrets.P12_BASE64 != '' }}
        env:
          P12_BASE64: ${{ secrets.P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          PROVISIONING_BASE64: ${{ secrets.PROVISIONING_BASE64 }}
          PROFILE_NAME: ${{ secrets.PROFILE_NAME }}
          TEAM_ID: ${{ secrets.TEAM_ID }}
        run: |
          set -e
          echo "$P12_BASE64" | base64 --decode > /tmp/dist.p12
          echo "$PROVISIONING_BASE64" | base64 --decode > /tmp/profile.mobileprovision

          security create-keychain -p "" build.keychain
          security import /tmp/dist.p12 -k build.keychain -P "$P12_PASSWORD" -T /usr/bin/codesign
          security list-keychains -s build.keychain
          security unlock-keychain -p "" build.keychain
          security set-key-partition-list -S apple-tool:,apple: -s -k "" build.keychain

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp /tmp/profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/

          cat > /tmp/export.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>ad-hoc</string>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>${{ env.BUNDLE_ID }}</key><string>$PROFILE_NAME</string>
            </dict>
            <key>teamID</key><string>$TEAM_ID</string>
          </dict>
          </plist>
          EOF

          flutter build ipa --release --export-options-plist=/tmp/export.plist

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: storex-ios-ipa
          path: build/ios/ipa/*.ipa
          if-no-files-found: error

  # ---------- Android APK（默认 debug 签名即可安装到真机） ----------
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"
          cache: true

      - name: Prepare native scaffolding
        run: |
          cp -r lib /tmp/storex_lib
          flutter create --org cn.solopai --project-name storex_app .
          rm -rf lib
          cp -r /tmp/storex_lib lib
          rm -f test/widget_test.dart

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: storex-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
