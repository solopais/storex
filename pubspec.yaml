name: storex_app
description: StoreX 原生应用商店客户端（Flutter）
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  shared_preferences: ^2.2.0
  url_launcher: ^6.3.0
  audioplayers: ^5.2.0
  video_player: ^2.8.2
  webview_flutter: ^4.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

# audioplayers_android 4.0.3 官方包 compileSdk=33，其依赖要求 >=34 导致
# checkReleaseAarMetadata 失败；vendor 修改版 compileSdk=35（third_party/）。
dependency_overrides:
  audioplayers_android:
    path: third_party/audioplayers_android

flutter:
  uses-material-design: true
